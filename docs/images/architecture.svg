<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">SiteDeck 架构示意</title><desc id="desc">工程师 CLI 通过 P2P 或 Hub 中继连接现场 Agent；Hub 负责发现、信令和访问授权，操作由 Agent 执行。本机 UI 无需 Hub。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 6 3 0 6" fill="none" stroke="#72cbb1" stroke-width="1.4"/></marker></defs><rect width="1400" height="520" rx="18" fill="#111c29"/><g font-family="Noto Sans CJK SC"><text x="48" y="61" fill="#eef6fa" font-size="25" font-weight="600">一个工作台，连接每个现场</text><g fill="#172a3b" stroke="#385367"><rect x="55" y="174" width="260" height="146" rx="14"/><rect x="550" y="123" width="295" height="132" rx="14"/><rect x="1073" y="174" width="270" height="146" rx="14"/></g><g fill="#edf8f4" font-size="23" font-weight="600" text-anchor="middle"><text x="185" y="219">工程师 CLI</text><text x="697" y="169">自建 Hub</text><text x="1208" y="219">现场 Agent</text></g><g fill="#9eb6c5" font-size="17" text-anchor="middle"><text x="185" y="253">配对文本 / 指纹固定</text><text x="185" y="282">交互终端与自动化</text><text x="697" y="202">发现 · 信令 · 授权</text><text x="697" y="232">设备列表与连接管理</text><text x="1208" y="253">本机 Shell · SSH · 串口</text><text x="1208" y="282">现场权限决定可用能力</text></g><g fill="none" stroke="#72cbb1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M323 199H538"/><path d="M855 199H1062"/><path d="M324 293V359H1062V293"/></g><g fill="#9bd9c7" font-size="15" text-anchor="middle"><text x="431" y="179">WSS</text><text x="959" y="179">WSS</text><text x="697" y="344">P2P / TURN / Hub 字节中继 · 端到端 TLS</text></g><path d="M55 399h1288" stroke="#2d4355"/><text x="55" y="443" fill="#c8dce5" font-size="17">本机 UI：终端 · 串口助手 · UDP / TCP 调试　无需 Hub 即可使用本机工具</text><text x="55" y="477" fill="#819aaf" font-size="14">Hub 不持有 Agent 的身份私钥或访客凭据；网络调试助手属于本机 UI。</text></g></svg>