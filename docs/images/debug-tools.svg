<g font-size="14" fill="#9bb7c5"><text x="70" y="606">✓ HEX 发送　追加：无　间隔：1000 ms</text><text x="741" y="606">指定连接发送　 /　 广播　 /　 手动断开</text></g>
<g fill="#1a4839"><rect x="67" y="626" width="146" height="38" rx="7"/><rect x="738" y="626" width="146" height="38" rx="7"/></g><g fill="#9ce7c4" font-size="15"><text x="88" y="652">发送 / 定时发送</text><text x="759" y="652">发送 / 定时发送</text></g><g fill="#91a9bb" font-size="14"><text x="241" y="652">清空显示　 /　 保存记录</text><text x="912" y="652">毫秒时间戳　 /　 字节计数</text></g>
<text x="48" y="743" font-size="17" fill="#c1d7e0">串口也可切回交互终端；网络调试工具在 Agent 本机直接收发，无需 Hub。</text><text x="48" y="777" font-size="14" fill="#7f9aae">TCP 为字节流；显示片段不代表业务协议帧。图中日志仅用于功能说明。</text></g></svg>