<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810" role="img" aria-labelledby="title desc"><title id="title">SiteDeck 串口与网络调试功能示意</title><desc id="desc">演示数据展示 HEX 收发、毫秒时间戳、字节计数与定时发送，以及 UDP、TCP Client 和 TCP Server 的连接选择、广播和断开。</desc><rect width="1400" height="810" rx="20" fill="#101c29"/><g font-family="Noto Sans CJK SC"><text x="48" y="61" font-size="26" font-weight="600" fill="#edf7f4">串口与网络，一个工作台</text><text x="48" y="97" font-size="16" fill="#8faabd">功能示意 · 演示数据 · 不包含真实服务器、设备身份或凭据</text>
<g fill="#142435" stroke="#355164"><rect x="45" y="130" width="638" height="558" rx="14"/><rect x="716" y="130" width="638" height="558" rx="14"/></g>
<g font-size="20" font-weight="600" fill="#e4f2ee"><text x="70" y="172">串口助手</text><text x="741" y="172">网络调试助手</text></g><g font-size="14" fill="#8cb2c4"><text x="70" y="204">115200 · 8N1 · 共享会话 / 只读加入</text><text x="741" y="204">UDP　 /　 TCP Client　 /　 TCP Server</text></g>
<g stroke="#2c4355"><path d="M45 226h638"/><path d="M716 226h638"/></g>
<g font-size="14" fill="#9de1c3"><text x="70" y="260">✓ HEX 显示　 ✓ 时间戳　 ✓ 自动滚动</text><text x="741" y="260">连接选择：全部客户端（广播）</text></g>
<g fill="#0b131e" stroke="#293f50"><rect x="67" y="285" width="594" height="207" rx="8"/><rect x="738" y="285" width="594" height="207" rx="8"/></g>
<g font-family="Noto Sans Mono CJK SC,monospace" font-size="14"><g fill="#a7becc"><text x="84" y="319">[10:24:16.082] TX  01 03 00 00 00 02</text><text x="84" y="353">[10:24:16.095] RX  01 03 04 00 2A 00 15</text><text x="84" y="387">[10:24:17.083] TX  01 03 00 00 00 02</text><text x="84" y="421">[10:24:17.096] RX  01 03 04 00 2A 00 15</text><text x="755" y="319">INFO  TCP client A connected</text><text x="755" y="353">INFO  TCP client B connected</text><text x="755" y="387">TX [broadcast]  55 AA 01 02</text><text x="755" y="421">RX [client A]  55 AA 00 01</text></g><g fill="#7bd8b1"><text x="84" y="465">RX 14 B  ·  TX 12 B</text><text x="755" y="465">原始字节收发 / UTF-8 文本 / HEX</text></g></g>
