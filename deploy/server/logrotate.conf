/root/sitedeck/logs/gateway-*.log {
    su root root
    daily
    rotate 7
    size 10M
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    sharedscripts
    postrotate
        if systemctl is-active --quiet sitedeck-gateway.service; then
            systemctl kill --kill-who=main -s USR1 sitedeck-gateway.service
        fi
    endscript
}
