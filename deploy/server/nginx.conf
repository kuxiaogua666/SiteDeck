user www-data;
worker_processes 1;
pid /run/sitedeck-gateway/nginx.pid;
error_log /root/sitedeck/logs/gateway-error.log warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    log_format safe escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
    access_log /root/sitedeck/logs/gateway-access.log safe;
    limit_req_zone $binary_remote_addr zone=hub_handshakes:1m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=hub_per_ip:1m;
    limit_conn_zone $server_name zone=hub_total:1m;
    limit_req_status 429;
    limit_conn_status 429;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 1k;
    large_client_header_buffers 2 8k;
    keepalive_timeout 15s;
    send_timeout 30s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:hub_tls:2m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    server {
        listen 0.0.0.0:48763 ssl;
        server_name __HUB_HOST__;
        ssl_certificate /root/sitedeck/tls/current/fullchain.pem;
        ssl_certificate_key /root/sitedeck/tls/current/privkey.pem;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /ws {
            limit_req zone=hub_handshakes burst=20 nodelay;
            limit_conn hub_per_ip 32;
            limit_conn hub_total 256;
            limit_except GET { deny all; }
            if ($http_upgrade !~* "^websocket$") { return 426; }
            proxy_pass http://127.0.0.1:48765;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 75s;
            proxy_read_timeout 75s;
        }

        # The management UI, API and health endpoint are private to SSH forwarding.
        location / { return 404; }
    }
}
